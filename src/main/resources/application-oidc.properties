# Activate with local,oidc for development or oidc for HTTPS production.
spring.security.oauth2.client.registration.google.provider=oidc
spring.security.oauth2.client.registration.google.client-id=${OIDC_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${OIDC_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.redirect-uri=${OIDC_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
spring.security.oauth2.client.provider.oidc.issuer-uri=${OIDC_ISSUER_URI}
