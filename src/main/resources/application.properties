spring.application.name=shinchoku-services
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/shinchoku}
spring.datasource.username=${DATABASE_USERNAME:shinchoku}
spring.datasource.password=${DATABASE_PASSWORD:shinchoku-local}
spring.flyway.enabled=true
spring.docker.compose.enabled=false
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cookie-secure=${COOKIE_SECURE:true}
app.session-hours=${SESSION_HOURS:24}
app.mail-enabled=${MAIL_ENABLED:false}
app.mail-from=${MAIL_FROM:noreply@example.invalid}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
